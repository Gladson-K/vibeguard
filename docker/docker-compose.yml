version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    environment:
      VG_DB: /data/vibeguard.db
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - vgdata:/data
    ports:
      - "${VG_GATEWAY_PORT:-18000}:8000"
    depends_on:
      - mosquitto
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  test-v1:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    profiles: ["v1", "ci"]
    environment:
      GATEWAY_URL: http://gateway:8000
      MQTT_HOST: mosquitto
      VG_SIL_BIN: /usr/local/bin/vg-sil-v1
      VG_REPORT_DIR: /app/reports
    depends_on:
      - gateway
      - mosquitto
    volumes:
      - ../reports:/app/reports
    command: >
      bash -c "docker/wait-for.sh http://gateway:8000/api/health 90 &&
      docker/wait-for.sh mosquitto:1883 60 &&
      pytest -q tests/v1 gateway/tests"

  test-v2:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    profiles: ["v2", "ci"]
    environment:
      GATEWAY_URL: http://gateway:8000
      MQTT_HOST: mosquitto
      VG_SIL_BIN: /usr/local/bin/vg-sil-v1
      VG_SIL_BIN_V2: /usr/local/bin/vg-sil-v2
      VG_SIL_BENCH: /usr/local/bin/vg-sil-bench
      VG_REPORT_DIR: /app/reports
    depends_on:
      - gateway
      - mosquitto
    volumes:
      - ../reports:/app/reports
    command: >
      bash -c "docker/wait-for.sh http://gateway:8000/api/health 90 &&
      docker/wait-for.sh mosquitto:1883 60 &&
      pytest -q tests/v2"

  ota-mock:
    build:
      context: ..
      dockerfile: docker/ota_mock.Dockerfile
    profiles: ["v3", "ci"]
    environment:
      VG_OTA_KEY_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      VG_OTA_VERSION: "4"
      VG_OTA_MIN_VERSION: "3"
    ports:
      - "${VG_OTA_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8080/manifest.json')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  test-v3:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    profiles: ["v3", "ci"]
    environment:
      VG_SIL_POWER: /usr/local/bin/vg-sil-v3_power
      VG_SIL_OTA: /usr/local/bin/vg-sil-v3_ota
      VG_SIL_PRODTEST: /usr/local/bin/vg-sil-v3_prodtest
      VG_SIL_STATE: /usr/local/bin/vg-sil-v3_state
      OTA_MOCK_URL: http://ota-mock:8080
      VG_OTA_KEY_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      VG_REPORT_DIR: /app/reports
    depends_on:
      - ota-mock
    volumes:
      - ../reports:/app/reports
    command: >
      bash -c "docker/wait-for.sh http://ota-mock:8080/manifest.json 60 &&
      pytest -q tests/v3"

  test-v4:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    profiles: ["v4", "ci"]
    environment:
      VG_SIL_V4_CODEC: /usr/local/bin/vg-sil-v4_codec
      VG_SIL_V4_ROLLOUT: /usr/local/bin/vg-sil-v4_rollout
      VG_SIL_V4_DIAG: /usr/local/bin/vg-sil-v4_diag
      VG_SIL_V4_RUL: /usr/local/bin/vg-sil-v4_rul
      VG_SIL_V4_DRIFT: /usr/local/bin/vg-sil-v4_drift
      VG_OTA_KEY_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      VG_REPORT_DIR: /app/reports
    volumes:
      - ../reports:/app/reports
    command: ["pytest", "-q", "tests/v4"]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${VG_PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${VG_GRAFANA_PASSWORD:-vibeguard}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${VG_GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus

  train-ml:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    profiles: ["ml"]
    command: ["python", "-m", "tools.train_autoencoder", "--out", "/app/models/tinyml"]

  firmware-build:
    build:
      context: ..
      dockerfile: docker/firmware.Dockerfile
    profiles: ["firmware"]

volumes:
  vgdata:
  promdata:
  grafanadata:
