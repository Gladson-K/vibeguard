[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<main_v2.cpp> -<main_v3.cpp> -<v3/>

[env:esp32s3_v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
build_flags = -DCORE_DEBUG_LEVEL=0 -DVG_V2=1
build_src_filter = +<*> -<main.cpp> -<main_v3.cpp> -<v3/>

[env:esp32s3_v3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
build_flags = -DCORE_DEBUG_LEVEL=0 -DVG_V3=1
build_src_filter = +<*> -<main.cpp> -<main_v2.cpp>

[env:esp32s3_v3_prodtest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
build_flags = -DCORE_DEBUG_LEVEL=0 -DVG_V3=1 -DVG_PRODTEST=1
build_src_filter = +<*> -<main.cpp> -<main_v2.cpp>
